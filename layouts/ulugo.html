<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" type="text/css" href="{{baseUrl}}/stylesheets/stylesheet.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="{{baseUrl}}/stylesheets/pygment_trac.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="{{baseUrl}}/stylesheets/ulugo.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="{{baseUrl}}/stylesheets/print.css" media="print" />

    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <title> {{title}} </title>
  </head>

  <body class="ulugo-layout">
    <header class="ulugo-header">
      <div class="inner">
        <a class="ulugo-brand" href="./" aria-label="Ulugo documentation home">
          <img class="ulugo-brand-logo" src="{{baseUrl}}/images/ulugo/logo-512.webp" alt="">
          <img class="ulugo-brand-wordmark" src="{{baseUrl}}/images/ulugo/wulu-512.webp" alt="Ulugo">
        </a>
      </div>
      <div class="ad">
<script async src="//pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
<!-- deepmess -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-3283235194066083"
     data-ad-slot="4224473058"
     data-ad-format="auto"></ins>
<script>
  (adsbygoogle = window.adsbygoogle || []).push({});
</script>
      </div>
    </header>

    <div id="content-wrapper">
      <div class="inner clearfix">
        <section id="main-content">
          <h2>{{title}}</h2>

          {{content}}

        </section>

        <aside id="sidebar">
          {{include:sidebar}}
        </aside>
      </div>
    </div>

    <script src="{{baseUrl}}/js/image-popup.js"></script>
  </body>
</html>
