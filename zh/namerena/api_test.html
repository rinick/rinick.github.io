<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset='utf-8'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名字竞技场 接口测试</title>
<style type="text/css">
html {
 width:100%;
 height:100%;

}
body {
 margin: 0;
 font-size: 15px;
 width:100%;
 height:100%;
 font-family: "Microsoft YaHei", Consolas, Menlo, Monaco, "Lucida Console", "Liberation Mono", "DejaVu Sans Mono", "Bitstream Vera Sans Mono", "Courier New", monospace, serif;
}
* {
 box-sizing: border-box;
}
.main{
display: flex;
flex-direction: row;
width:100%;
height:100%;
}

.left{
width:200px;
}
.left > * {
	margin:8px;
}

iframe{
flex: 1 1 auto;
width:100%;
height:100%;
}
textarea{
min-height: 150px;
}

</style>

</head>
<body>

<div class='main'>
	<div class='left'>
		<div><label for="names">参战名字</label></div>
		<textarea id="names">中国
日本</textarea>
		<button id="start" type="button">开始</button>
		<div><label for="winners">胜利者</label></div>
		<textarea id="winners" readonly></textarea>
	</div>
	<iframe id="namerena" title="名字竞技场"></iframe>
</div>
<script>
const iframe = document.querySelector("#namerena");
const winnersOutput = document.querySelector("#winners");
const game = new URL("/namerena/?lang=zh", location.origin);

document.querySelector("#start").addEventListener("click", () => {
  const bytes = new TextEncoder().encode(document.querySelector("#names").value);
  const binary = Array.from(bytes, (byte) => String.fromCharCode(byte)).join("");
  const encoded = btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  winnersOutput.value = "";
  game.hash = `n=${encoded}`;
  iframe.src = game.href;
});

window.addEventListener("message", (event) => {
  if (event.origin !== game.origin || event.source !== iframe.contentWindow) return;
  const { winners, all } = event.data ?? {};
  if (!Array.isArray(winners) || !Array.isArray(all)) return;
  winnersOutput.value = winners.join("\n");
});
</script>
</body>
</html>
